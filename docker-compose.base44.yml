# Base44 sandbox dev stack — runs the app straight from the cloned source.
# Frontend: Vite dev server on host port 3000 (the preview entry point).
# Backend:  FastAPI on host port 8000, proxied by Vite under /api (single origin).
# Postgres: local infra service; credentials are generated here, not user secrets.
services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: paranormal
      POSTGRES_PASSWORD: paranormal
      POSTGRES_DB: paranormal_money
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paranormal -d paranormal_money"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /app
    # Dependencies live in the image layer (node_modules-style mounts would hide
    # them); source is bind-mounted so --reload picks up edits.
    command:
      - sh
      - -ec
      - >-
        pip install --no-cache-dir -r requirements.txt &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://paranormal:paranormal@db:5432/paranormal_money
      PYTHONUNBUFFERED: "1"
      # Receipt photos live on their own volume so they survive restarts.
      RECEIPTS_DIR: /data/receipts
      BASE44_PREVIEW_MODE:
      # Bind mounts don't always emit inotify events; poll only in preview mode.
      WATCHFILES_FORCE_POLLING: ${BASE44_PREVIEW_MODE:+1}
    volumes:
      - ./backend:/app
      - receipts_data:/data/receipts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    image: node:22-slim
    restart: on-failure
    working_dir: /app
    command:
      - sh
      - -ec
      - CI=true npm install --no-audit --no-fund && exec npm run dev
    environment:
      BASE44_PREVIEW_MODE:
      BASE44_SANDBOX_HOST_DOMAIN:
      BASE44_PUBLIC_HOST_SUFFIX:
      # Vite >= 6.1 appends this to server.allowedHosts (platform-provided).
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  db_data:
  web_node_modules:
  receipts_data:
